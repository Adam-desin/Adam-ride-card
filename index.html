<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adam Ride Card</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 430px;
      background: #1b1b1b;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 15px 40px rgba(0,0,0,0.5);
      border: 1px solid #333;
    }
    .hero {
      padding: 35px 25px 25px;
      text-align: center;
      background: linear-gradient(145deg, #202020, #101010);
    }
    .logo {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 17px;
      color: #ccc;
      margin-bottom: 22px;
    }
    .slogan {
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      margin-bottom: 5px;
    }
    .location {
      color: #aaa;
      font-size: 14px;
    }
    .content {
      padding: 25px;
    }
    .service {
      background: #252525;
      padding: 17px;
      border-radius: 15px;
      margin-bottom: 12px;
      text-align: center;
      font-size: 16px;
      font-weight: 600;
    }
    .button {
      display: block;
      text-decoration: none;
      text-align: center;
      padding: 16px;
      border-radius: 14px;
      margin-top: 12px;
      font-size: 17px;
      font-weight: bold;
    }
    .whatsapp {
      background: #25D366;
      color: #fff;
    }
    .call {
      background: #fff;
      color: #111;
    }
    .footer {
      text-align: center;
      color: #777;
      font-size: 12px;
      padding: 0 20px 22px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="hero">
      <div class="logo">ADAM RIDE</div>
      <div class="subtitle">
        Private Driver & Airport Transfers
      </div>
      <div class="slogan">
        Ride easy, travel happy!
      </div>
      <div class="location">
        Iceland • Reykjavík • Airport Transfers
      </div>
    </div>
    <div class="content">
      <div class="service">
        ✈️ Airport Transfers
      </div>
      <div class="service">
        🚗 Private Rides
      </div>
      <div class="service">
        🌋 Golden Circle & Tourist Trips
      </div>
      <a
        class="button whatsapp"
        href="https://wa.me/31687344108"
        target="_blank">
        💬 WhatsApp Adam
      </a>
      <a
        class="button call"
        href="tel:+31687344108">
        📞 Call Adam
      </a>
    </div>
    <div class="footer">
      Reliable • Comfortable • Professional
    </div>
  </div>
</body>
</html>
